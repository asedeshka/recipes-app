name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Підготувати веб-файли
        run: |
          mkdir www
          cp index.html style.css app.js manifest.json sw.js icon-192.png icon-512.png www/

      - name: Встановити Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Додати Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Зібрати APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: recipes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
